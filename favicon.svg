<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>

    <!-- Border stroke gradient with subtle green glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radial neon glow -->
    <radialGradient id="neonRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#22c55e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>

    <!-- Vibrant M letter gradient -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="30%" stop-color="#4ade80"/>
      <stop offset="70%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Glow drop filter -->
    <filter id="mShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#22c55e" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle dark container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="10"/>

  <!-- Radial glow in the background -->
  <circle cx="256" cy="256" r="180" fill="url(#neonRadial)"/>

  <!-- Geometric 'M' (Metodo Fantasma) -->
  <path d="M 116 384 L 116 128 L 184 128 L 256 260 L 328 128 L 396 128 L 396 384 L 336 384 L 336 216 L 272 332 L 240 332 L 176 216 L 176 384 Z"
        fill="url(#mGrad)"
        stroke="url(#mGrad)"
        stroke-width="12"
        stroke-linejoin="round"
        filter="url(#mShadow)"/>
</svg>
